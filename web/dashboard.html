<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VirtualHerd — Smart Pasture System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Sora:wght@300;400;600;700&display=swap');

  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2330;
    --border: #2a3441;
    --accent: #3fb950;
    --accent2: #f7c948;
    --danger: #f85149;
    --pulse: #58a6ff;
    --warn: #ff7b25;
    --text: #e6edf3;
    --muted: #7d8590;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .logo-icon { font-size: 1.4rem; }
  .logo span { color: var(--accent); }

  .header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.75rem;
    font-family: 'DM Mono', monospace;
    color: var(--muted);
  }

  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: blink 1.5s infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .tab-nav {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    flex-shrink: 0;
  }

  .tab-btn {
    padding: 10px 20px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    font-family: 'Sora', sans-serif;
  }

  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-btn:hover { color: var(--text); }

  .main { display: flex; flex: 1; overflow: hidden; }

  .tab-content { display: none; flex: 1; overflow: hidden; }
  .tab-content.active { display: flex; }

  /* MAP TAB */
  .canvas-wrap { flex: 1; background: #0a1520; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: default; }

  .sidebar {
    width: 280px;
    background: var(--surface);
    border-left: 1px solid var(--border);
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .panel {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
  }

  .panel-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--accent);
    margin-bottom: 8px;
  }

  .herd-overview {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .stat { text-align: center; }
  .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.65rem; color: var(--muted); margin-top: 2px; text-transform: uppercase; }

  .legend { font-size: 0.75rem; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

  .herd-list { max-height: 200px; overflow-y: auto; font-size: 0.75rem; }
  .herd-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
  }
  .herd-item:last-child { border-bottom: none; }
  .herd-id { color: var(--accent); font-weight: 600; }
  .herd-behavior { color: var(--muted); }

  .alerts-list { max-height: 150px; overflow-y: auto; font-size: 0.75rem; }
  .alert-item {
    background: var(--surface);
    border-left: 3px solid var(--warn);
    padding: 8px;
    margin-bottom: 6px;
    border-radius: 4px;
  }
  .alert-item.critical { border-left-color: var(--danger); }
  .alert-type { color: var(--accent2); font-weight: 600; }
  .alert-detail { color: var(--muted); font-size: 0.7rem; margin-top: 2px; }

  /* HEALTH TAB */
  .health-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
    padding: 20px;
    overflow-y: auto;
    flex: 1;
    align-content: start;
  }

  .health-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }

  .health-card-title {
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 10px;
    font-size: 0.9rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 6px;
  }

  .health-metric {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 5px;
  }
  .health-metric-label { color: var(--muted); }
  .health-metric-value { color: var(--text); font-weight: 600; }

  /* PADDOCKS TAB */
  .paddock-list {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 15px;
    align-content: start;
  }

  .paddock-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }

  .paddock-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .paddock-name { color: var(--accent); font-weight: 700; font-size: 1rem; }

  .paddock-badge {
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
  }
  .badge-available { background: rgba(63,185,80,0.2); color: var(--accent); }
  .badge-occupied { background: rgba(88,166,255,0.2); color: var(--pulse); }
  .badge-recovering { background: rgba(255,123,37,0.2); color: var(--warn); }
  .badge-recommended { background: rgba(247,201,72,0.2); color: var(--accent2); }

  .paddock-stat {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    margin-bottom: 6px;
    color: var(--muted);
  }
  .paddock-stat span:last-child { color: var(--text); font-weight: 600; }

  .quality-bar-wrap {
    margin-top: 10px;
    background: var(--border);
    border-radius: 4px;
    height: 6px;
    overflow: hidden;
  }
  .quality-bar {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s;
  }

  /* SCHEDULE TAB */
  .schedule-view {
    padding: 20px;
    overflow-y: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .schedule-header {
    background: var(--surface2);
    border: 1px solid var(--accent2);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 4px;
  }

  .schedule-header h3 { color: var(--accent2); margin-bottom: 6px; font-size: 0.9rem; }
  .schedule-header p { color: var(--muted); font-size: 0.8rem; }

  .schedule-day {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    gap: 16px;
    align-items: center;
  }

  .schedule-day.today { border-color: var(--accent); }

  .schedule-day-num {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent);
    min-width: 40px;
    text-align: center;
    font-family: 'DM Mono', monospace;
  }

  .schedule-day.today .schedule-day-num { color: var(--accent2); }

  .schedule-day-info { flex: 1; }
  .schedule-day-name { font-weight: 600; margin-bottom: 4px; }
  .schedule-day-paddock { color: var(--accent); font-size: 0.85rem; margin-bottom: 4px; }
  .schedule-day-details { color: var(--muted); font-size: 0.75rem; }

  .schedule-quality {
    text-align: right;
    min-width: 60px;
  }
  .schedule-quality-num { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
  .schedule-quality-label { font-size: 0.65rem; color: var(--muted); }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface2); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-icon">🐄</span>
    <span>Virtual <span>Herd</span> — Smart Pasture System</span>
  </div>
  <div class="header-right">
    <span id="dayDisplay">Day 1</span>
    <div class="live-dot"></div>
    <span id="connectionStatus">CONNECTING...</span>
  </div>
</header>

<div class="tab-nav">
  <button class="tab-btn active" data-tab="map">🗺 Map</button>
  <button class="tab-btn" data-tab="health">❤️ Health</button>
  <button class="tab-btn" data-tab="paddocks">🌾 Paddocks</button>
  <button class="tab-btn" data-tab="schedule">📅 Schedule</button>
</div>

<div class="main">

  <!-- MAP TAB -->
  <div id="map" class="tab-content active">
    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
    </div>
    <div class="sidebar">
      <div class="panel">
        <div class="panel-title">Herd Overview</div>
        <div class="herd-overview">
          <div class="stat">
            <div class="stat-value" id="totalCows">0</div>
            <div class="stat-label">Cows</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="healthyCows">0</div>
            <div class="stat-label">Healthy</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="alertCount">0</div>
            <div class="stat-label">Alerts</div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Live Alerts</div>
        <div class="alerts-list" id="alertsList">
          <div style="color: var(--muted); font-size: 0.7rem;">No alerts</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Herd List</div>
        <div class="herd-list" id="herdList">
          <div style="color: var(--muted); font-size: 0.7rem;">No cattle added</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-title">Legend</div>
        <div class="legend">
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--accent);"></div>
            <span>Healthy</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--pulse);"></div>
            <span>Lying Down</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--warn);"></div>
            <span>Lameness</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--danger);"></div>
            <span>Fever / Stress</span>
          </div>
          <div class="legend-item">
            <div class="legend-dot" style="background: var(--accent2);"></div>
            <span>Hypothermia</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- HEALTH TAB -->
  <div id="health" class="tab-content">
    <div class="health-grid" id="healthGrid">
      <div style="color: var(--muted); padding: 20px; grid-column: 1/-1;">Add cattle to see health data</div>
    </div>
  </div>

  <!-- PADDOCKS TAB -->
  <div id="paddocks" class="tab-content">
    <div class="paddock-list" id="paddockList">
      <div style="color: var(--muted);">Loading paddocks...</div>
    </div>
  </div>

  <!-- SCHEDULE TAB -->
  <div id="schedule" class="tab-content">
    <div class="schedule-view" id="scheduleView">
      <div style="color: var(--muted);">Loading schedule...</div>
    </div>
  </div>

</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script>
  const BACKEND_URL = 'http://localhost:5000';
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  let cattle = {};
  let alerts = [];
  let paddocksData = [];
  let scheduleData = [];

  // ── Canvas resize ──
  function resizeCanvas() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // ── Cattle color by health ──
  function getCattleColor(c) {
    const s = (c.health_status || '').toLowerCase();
    if (s === 'fever' || s === 'stress') return '#f85149';
    if (s === 'hypothermia') return '#f7c948';
    if (c.lying) return '#58a6ff';
    if (c.lameness) return '#ff7b25';
    return '#3fb950';
  }

  // ── Canvas draw loop ──
  function draw() {
    ctx.fillStyle = '#0a1520';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid
    ctx.strokeStyle = 'rgba(47, 85, 59, 0.2)';
    ctx.lineWidth = 1;
    for (let i = 0; i < canvas.width; i += 50) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height); ctx.stroke();
    }
    for (let i = 0; i < canvas.height; i += 50) {
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(canvas.width, i); ctx.stroke();
    }

    // Cattle dots
    Object.values(cattle).forEach(c => {
      const x = (c.x / 100) * canvas.width;
      const y = (c.y / 100) * canvas.height;
      const color = getCattleColor(c);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(x, y, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = '#fff';
      ctx.font = 'bold 8px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(c.cattle_id, x, y);
    });

    requestAnimationFrame(draw);
  }
  draw();

  // ── Tab switching ──
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tabId = btn.getAttribute('data-tab');
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    });
  });

  // ── Update Map tab ──
  function updateMapUI() {
    const total = Object.keys(cattle).length;
    const healthy = Object.values(cattle).filter(c => {
      const s = (c.health_status || '').toLowerCase();
      return s === 'healthy' || s === '';
    }).length;

    document.getElementById('totalCows').textContent = total;
    document.getElementById('healthyCows').textContent = healthy;
    document.getElementById('alertCount').textContent = alerts.length;

    document.getElementById('herdList').innerHTML = Object.values(cattle).length
      ? Object.values(cattle).map(c => `
          <div class="herd-item">
            <span class="herd-id">#${c.cattle_id}</span>
            <span class="herd-behavior" style="color: ${getCattleColor(c)}">${c.health_status || c.behavior || 'HEALTHY'}</span>
          </div>`).join('')
      : '<div style="color: var(--muted); font-size: 0.7rem;">No cattle added</div>';

    document.getElementById('alertsList').innerHTML = alerts.length
      ? alerts.slice(0, 8).map(a => `
          <div class="alert-item ${a.severity === 'critical' ? 'critical' : ''}">
            <div class="alert-type">${a.type}</div>
            <div class="alert-detail">Cattle #${a.cattle_id}</div>
          </div>`).join('')
      : '<div style="color: var(--muted); font-size: 0.7rem;">No alerts</div>';
  }

  // ── Update Health tab ──
  function updateHealthTab() {
    const cattleArr = Object.values(cattle);
    if (!cattleArr.length) {
      document.getElementById('healthGrid').innerHTML =
        '<div style="color: var(--muted); padding: 20px; grid-column: 1/-1;">Add cattle to see health data</div>';
      return;
    }

    document.getElementById('healthGrid').innerHTML = cattleArr.map(c => {
      const statusColor = (() => {
        const s = (c.health_status || '').toLowerCase();
        if (s === 'fever' || s === 'stress') return 'var(--danger)';
        if (s === 'hypothermia') return 'var(--accent2)';
        return 'var(--accent)';
      })();
      return `
        <div class="health-card">
          <div class="health-card-title">🐄 Cattle #${c.cattle_id}</div>
          <div class="health-metric">
            <span class="health-metric-label">Temperature</span>
            <span class="health-metric-value" style="color: ${c.temperature > 39.5 ? 'var(--danger)' : 'inherit'}">${(c.temperature || 0).toFixed(1)}°C</span>
          </div>
          <div class="health-metric">
            <span class="health-metric-label">Heart Rate</span>
            <span class="health-metric-value" style="color: ${c.heart_rate > 100 ? 'var(--danger)' : 'inherit'}">${c.heart_rate || 0} bpm</span>
          </div>
          <div class="health-metric">
            <span class="health-metric-label">Milk Production</span>
            <span class="health-metric-value">${(c.milk_production || 0).toFixed(1)} L/day</span>
          </div>
          <div class="health-metric">
            <span class="health-metric-label">Health Status</span>
            <span class="health-metric-value" style="color: ${statusColor}">${c.health_status || 'HEALTHY'}</span>
          </div>
          <div class="health-metric">
            <span class="health-metric-label">Behavior</span>
            <span class="health-metric-value">${c.behavior || '—'}</span>
          </div>
          <div class="health-metric">
            <span class="health-metric-label">Position</span>
            <span class="health-metric-value">(${(c.x||0).toFixed(0)}, ${(c.y||0).toFixed(0)})</span>
          </div>
        </div>`;
    }).join('');
  }

  // ── Update Paddocks tab ──
  function updatePaddocksTab() {
    if (!paddocksData.length) {
      document.getElementById('paddockList').innerHTML = '<div style="color: var(--muted);">No paddocks</div>';
      return;
    }

    document.getElementById('paddockList').innerHTML = paddocksData.map(p => {
      const badgeClass = p.recommended ? 'badge-recommended' :
        p.status === 'available' ? 'badge-available' :
        p.status === 'occupied' ? 'badge-occupied' : 'badge-recovering';
      const badgeLabel = p.recommended ? '⭐ Recommended' : p.status;
      const qualityColor = p.grass_quality >= 80 ? '#3fb950' : p.grass_quality >= 65 ? '#f7c948' : '#f85149';

      return `
        <div class="paddock-item">
          <div class="paddock-header">
            <div class="paddock-name">${p.name}</div>
            <div class="paddock-badge ${badgeClass}">${badgeLabel}</div>
          </div>
          <div class="paddock-stat"><span>Area</span><span>${p.area_hectares} ha</span></div>
          <div class="paddock-stat"><span>Grass Quality</span><span style="color:${qualityColor}">${p.grass_quality}%</span></div>
          <div class="paddock-stat"><span>Grass Available</span><span>${p.grass_available_kg} kg</span></div>
          <div class="paddock-stat"><span>Cattle / Capacity</span><span>${p.cattle_count} / ${p.capacity}</span></div>
          <div class="paddock-stat"><span>Days Resting</span><span>${p.days_resting}</span></div>
          <div class="quality-bar-wrap">
            <div class="quality-bar" style="width:${p.grass_quality}%; background:${qualityColor}"></div>
          </div>
        </div>`;
    }).join('');
  }

  // ── Update Schedule tab ──
  function updateScheduleTab() {
    if (!scheduleData.length) {
      document.getElementById('scheduleView').innerHTML = '<div style="color: var(--muted);">No schedule</div>';
      return;
    }

    const recommendation = scheduleData.recommended_next || 'P3';
    const days = Array.isArray(scheduleData) ? scheduleData : scheduleData.schedule || [];

    document.getElementById('scheduleView').innerHTML = `
      <div class="schedule-header">
        <h3>🌾 Rotational Grazing Plan</h3>
        <p>28-day cycle · Next recommended: ${days[0]?.paddock_name || 'East Pasture'} · ML-optimised</p>
      </div>
      ${days.map((s, i) => `
        <div class="schedule-day ${i === 0 ? 'today' : ''}">
          <div class="schedule-day-num">${i === 0 ? '0' : i}</div>
          <div class="schedule-day-info">
            <div class="schedule-day-name">${s.name}</div>
            <div class="schedule-day-paddock">📍 ${s.paddock_name}</div>
            <div class="schedule-day-details">
              ${s.cattle_count} cattle · ${s.duration_hours}h · ${s.grass_available} kg grass
            </div>
          </div>
          <div class="schedule-quality">
            <div class="schedule-quality-num" style="color: ${s.grass_quality >= 80 ? 'var(--accent)' : s.grass_quality >= 65 ? 'var(--accent2)' : 'var(--danger)'}">${s.grass_quality}%</div>
            <div class="schedule-quality-label">quality</div>
          </div>
        </div>`).join('')}`;
  }

  // ── Master update ──
  function updateAllUI() {
    updateMapUI();
    updateHealthTab();
    updatePaddocksTab();
    updateScheduleTab();
  }

  // ── Fetch paddocks ──
  function fetchPaddocks() {
    fetch(`${BACKEND_URL}/api/paddocks`)
      .then(r => r.json())
      .then(data => { paddocksData = data.paddocks || []; updatePaddocksTab(); })
      .catch(e => console.warn('Paddocks fetch error:', e));
  }

  // ── Fetch schedule ──
  function fetchSchedule() {
    fetch(`${BACKEND_URL}/api/schedule`)
      .then(r => r.json())
      .then(data => { scheduleData = data; updateScheduleTab(); })
      .catch(e => console.warn('Schedule fetch error:', e));
  }

  // ── WebSocket ──
  const socket = io(BACKEND_URL);

  socket.on('connect', () => {
    console.log('✅ Connected to backend');
    document.getElementById('connectionStatus').textContent = 'LIVE';
    document.getElementById('connectionStatus').style.color = 'var(--accent)';
    fetchPaddocks();
    fetchSchedule();
  });

  socket.on('disconnect', () => {
    document.getElementById('connectionStatus').textContent = 'DISCONNECTED';
    document.getElementById('connectionStatus').style.color = 'var(--danger)';
  });

  socket.on('cattle_update', (data) => {
    if (data.cattle) {
      cattle = {};
      data.cattle.forEach(c => { cattle[c.cattle_id] = c; });
      updateAllUI();
      if (data.training_day) {
        document.getElementById('dayDisplay').textContent = `Day ${data.training_day}`;
      }
    }
    if (data.alerts) { alerts = data.alerts; updateMapUI(); }
  });

  socket.on('cattle_added', (data) => {
    if (data.cattle) {
      cattle[data.cattle.cattle_id] = data.cattle;
      updateAllUI();
      fetchPaddocks();
    }
  });

  socket.on('cattle_removed', (data) => {
    if (data.cattle_id) {
      delete cattle[data.cattle_id];
      updateAllUI();
      fetchPaddocks();
    }
  });

  // ── Initial load ──
  fetch(`${BACKEND_URL}/api/cattle`)
    .then(r => r.json())
    .then(data => {
      if (data.cattle) {
        data.cattle.forEach(c => { cattle[c.cattle_id] = c; });
        updateAllUI();
      }
    })
    .catch(e => console.warn('Initial load error:', e));

  // Refresh paddocks and schedule every 30s
  setInterval(fetchPaddocks, 30000);
  setInterval(fetchSchedule, 30000);
</script>

</body>
</html>
